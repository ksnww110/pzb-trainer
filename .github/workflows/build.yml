
name: Build PBZ Trainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/PBZTrainer/PBZTrainer.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o out

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PBZTrainer-Fixed
          path: out/PBZTrainer.exe
